# Builds the pack on pushes and pull requests, and publishes the zip:
# - every push (including merges) to main updates the rolling "Development build" pre-release
# - pushing a version tag such as v0.3.0 publishes a normal release for that version
# Every run checks the generated pack and keeps its zip as a downloadable artifact on the run's page.

name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install Pillow
      run: pip install pillow

    # A version tag such as v0.4.0 sets the pack version; other builds use the default in tools/generate.py.
    - name: Generate the pack
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          python3 tools/generate.py --version "${GITHUB_REF_NAME#v}"
        else
          python3 tools/generate.py
        fi

    # Hytale can't run here, so this checks references instead of loading the pack.
    - name: Check the pack
      run: python3 tools/check_pack.py

    # CurseForge needs manifest.json at the top of the zip, not inside a MoreDyes folder.
    - name: Zip the pack
      run: |
        version=$(python3 -c "import json; print(json.load(open('pack/MoreDyes/manifest.json'))['Version'])")
        mkdir -p dist
        (cd pack/MoreDyes && zip -qr "../../dist/MoreDyes-$version.zip" .)
        unzip -l dist/*.zip | grep -q " manifest.json$"
        ls -l dist

    - name: Upload the pack zip
      uses: actions/upload-artifact@v7
      with:
        name: MoreDyes
        path: dist/*.zip
        if-no-files-found: error

  publish:
    needs: build
    # Pushes and merges to main, and version tags. Never pull requests.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # Two quick pushes to main must not replace the development build at the same time.
    concurrency:
      group: publish-${{ github.ref }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
    - name: Download the pack zip
      uses: actions/download-artifact@v8
      with:
        name: MoreDyes
        path: dist

    - name: Update the development build
      if: github.ref == 'refs/heads/main'
      run: |
        # Replace the previous development build, so the release always holds the newest zip.
        gh release delete dev-build --yes --cleanup-tag || true
        gh release create dev-build dist/*.zip \
          --target "$GITHUB_SHA" \
          --prerelease \
          --title "Development build" \
          --notes "Latest build of main, from commit $GITHUB_SHA. Untested; for testing only."

    - name: Publish the release for this version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        # A release drafted on GitHub for this tag already exists; attach the zip to it instead.
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
        else
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "More Dyes $GITHUB_REF_NAME" \
            --generate-notes
        fi

    # Hytale projects aren't supported by mc-publish, so this calls CurseForge's upload API directly.
    # Hytale uploads go through legacy.curseforge.com with game version 14284.
    - name: Upload the release to CurseForge
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        CURSEFORGE_PROJECT_ID: '1725010'
      run: |
        if [ -z "$CURSEFORGE_TOKEN" ]; then
          echo "::warning::CURSEFORGE_TOKEN is not set, so the release was not uploaded to CurseForge."
          exit 0
        fi
        file=$(ls dist/*.zip)
        metadata=$(jq -n \
          --arg name "More Dyes $GITHUB_REF_NAME" \
          --arg notes "See https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
          '{displayName: $name, changelog: $notes, changelogType: "text", releaseType: "release", gameVersions: [14284]}')
        curl -sS --fail-with-body \
          -H "X-Api-Token: $CURSEFORGE_TOKEN" \
          -F "metadata=$metadata" \
          -F "file=@$file" \
          "https://legacy.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/upload-file"
